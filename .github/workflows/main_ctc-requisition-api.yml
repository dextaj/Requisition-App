name: Build and deploy Python app to Azure Web App - ctc-requisition-api

on:
  push:
    branches:
      - main
    paths:
      - 'auth_api.py'
      - 'requirements.txt'
      - '.github/workflows/main_ctc-requisition-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create and start virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          retention-days: 1
          path: |
            .
            !antenv/
            !.git/
            !build/
            !dist/
            !web/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_53262C48532949B7A4502F281F116AAB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A83E7CDC0E72485082B6AC6B18C2B80F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_973B987EE1A3494E926E697E0667BDD2 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ctc-requisition-api'
          slot-name: 'Production'
