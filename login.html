<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Teachers College — Login</title>
  <style>
    body {
      font-family: 'Segoe UI', Verdana, sans-serif;
      background: #F7F3EE;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0;
    }
    .card {
      background: #fff; padding: 40px; border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 320px; border-top: 4px solid #C8A96E;
    }
    h1 { color: #1A2B4A; font-size: 20px; margin: 0 0 4px; }
    .sub { color: #78716C; font-size: 13px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: bold;
            color: #1C1917; margin: 14px 0 4px; }
    input {
      width: 100%; padding: 10px; border: 1px solid #D8D0C8;
      border-radius: 4px; font-size: 14px; box-sizing: border-box;
    }
    button {
      width: 100%; margin-top: 22px; padding: 11px;
      background: #2563EB; color: #fff; border: none; border-radius: 4px;
      font-size: 14px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #1D4ED8; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .error { color: #DC2626; }
    .ok { color: #16A34A; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Church Teachers College</h1>
    <div class="sub">Requisition Management — Sign in</div>
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
    <button onclick="doLogin()">Sign In</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";

    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");
      msg.className = "msg";
      msg.textContent = "Signing in...";

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, os_user: "web" })
        });

        if (!res.ok) {
          msg.className = "msg error";
          msg.textContent = res.status === 401
            ? "Invalid username or password."
            : `Login failed (${res.status}).`;
          return;
        }

        const data = await res.json();
        // Store the token — field name adjusted once I see the real response
        const token = data.token || data.access_token;
        localStorage.setItem("ctc_token", token);

        localStorage.setItem("ctc_user", data.full_name || "");
        localStorage.setItem("ctc_admin", data.is_admin ? "1" : "");
        window.location.href = "requisitions.html";
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Could not reach the server. Is the API running?";
        console.error(err);
      }
    }

    // Allow Enter key to submit
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
