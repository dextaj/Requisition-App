<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requisition — Church Teachers College</title>
  <style>
    body { font-family: 'Segoe UI', Verdana, sans-serif; background: #F7F3EE;
           margin: 0; color: #1C1917; }
    header { background: #1A2B4A; color: #fff; padding: 16px 24px;
             display: flex; align-items: center; justify-content: space-between;
             border-bottom: 3px solid #C8A96E; }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: #C8A96E; font-size: 13px; text-decoration: none; }
    .wrap { max-width: 900px; margin: 24px auto; padding: 0 24px; }
    .card { background: #fff; border: 1px solid #D8D0C8; border-radius: 6px;
            margin-bottom: 20px; overflow: hidden; }
    .card h2 { font-size: 14px; color: #1A2B4A; margin: 0;
               padding: 12px 16px; border-bottom: 2px solid #C8A96E; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px;
            padding: 16px; }
    .field { display: flex; flex-direction: column; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 12px; font-weight: bold; color: #78716C; margin-bottom: 3px; }
    .val { font-size: 14px; color: #1C1917; padding: 6px 0;
           border-bottom: 1px solid #eee; min-height: 20px; }
    .phase { display: inline-block; padding: 4px 12px; border-radius: 12px;
             font-size: 13px; font-weight: bold; }
    .msg { padding: 24px; color: #78716C; }
  </style>
</head>
<body>
  <header>
    <h1>Requisition Details</h1>
    <a href="requisitions.html">&larr; Back to list</a>
  </header>
  <div class="wrap" id="content">
    <div class="msg" id="msg">Loading...</div>
  </div>

  <script>
    const API_BASE = "https://ctc-requisition-api-aybadkhdftfpf4cf.centralus-01.azurewebsites.net";
    const token = localStorage.getItem("ctc_token");
    if (!token) { window.location.href = "login.html"; }

    // Read the doc number from the URL (?doc=...)
    const params = new URLSearchParams(window.location.search);
    const doc = params.get("doc");

    async function apiGet(path) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.status === 401) { window.location.href = "login.html"; return null; }
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      return res.json();
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, c =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    }
    function phaseColor(phase) {
      const p = (phase || "").toLowerCase();
      if (p === "draft") return "background:#fffbeb;color:#92400e";
      if (p.includes("review")) return "background:#eff6ff;color:#1e3a8a";
      if (p === "accounts" || p === "completed") return "background:#f9fafb;color:#6b7280";
      return "background:#f0fdf4;color:#14532d";
    }

    // Show one field: label + value
    function field(label, value, full) {
      return `<div class="field${full ? ' full' : ''}">
                <label>${label}</label>
                <div class="val">${esc(value)}</div>
              </div>`;
    }

    async function load() {
      if (!doc) { document.getElementById("msg").textContent = "No document specified."; return; }
      try {
        const r = await apiGet(`/requisitions/${encodeURIComponent(doc)}`);
        if (!r) { document.getElementById("msg").textContent = "Requisition not found."; return; }

        const content = document.getElementById("content");
        content.innerHTML = `
          <div class="card">
            <h2>${esc(r.Document_Number || doc)}
              <span class="phase" style="${phaseColor(r.Phase)}">${esc(r.Phase)}</span>
            </h2>
            <div class="grid">
              ${field("Created By", r.Created_By)}
              ${field("Site", r.Site)}
              ${field("Category", r.Category)}
              ${field("Department", r.Department)}
              ${field("Academic", r.Academic)}
              ${field("Maintenance Area", r.Maintenance)}
              ${field("Purchased At", r.Supplier)}
              ${field("Cost", r.Cost)}
              ${field("Assigned To", r.Assign_To)}
              ${field("Submit Date", r.Submit_Date)}
              ${field("Purpose", r.Purpose, true)}
              ${field("Items Requested", r.Requesting, true)}
              ${field("HOD Comment", r.HOD_Comment, true)}
              ${field("VP Reviewer Notes", r.VP_Comment, true)}
              ${field("Principal Comments", r.Principal_Comment, true)}
              ${field("Processed References", r.Processed_Refs, true)}
            </div>
          </div>`;
      } catch (err) {
        document.getElementById("msg").textContent = "Error: " + err.message;
      }
    }
    load();
  </script>
</body>
</html>
