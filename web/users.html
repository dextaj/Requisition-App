<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — Church Teachers College</title>
  <style>
    body { font-family: 'Segoe UI', Verdana, sans-serif; background: #F7F3EE;
           margin: 0; color: #1C1917; }
    header { background: #1A2B4A; color: #fff; padding: 16px 24px;
             display: flex; align-items: center; justify-content: space-between;
             border-bottom: 3px solid #C8A96E; }
    header .brand { display: flex; align-items: center; gap: 12px; }
    header img { height: 40px; }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: #C8A96E; font-size: 13px; text-decoration: none; }
    .wrap { max-width: 1000px; margin: 20px auto; padding: 0 24px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #fff; border: 1px solid #D8D0C8; border-radius: 6px;
            overflow: hidden; }
    .card h2 { font-size: 14px; color: #1A2B4A; margin: 0;
               padding: 12px 16px; border-bottom: 2px solid #C8A96E;
               display: flex; justify-content: space-between; align-items: center; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 14px; font-size: 12px; color: #78716C;
         border-bottom: 1px solid #eee; }
    td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f2efe9; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #FBF9F5; }
    tbody tr.selected { background: #F0F4FA; }
    .form-body { padding: 16px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: bold; color: #78716C;
            margin-bottom: 4px; }
    input { width: 100%; padding: 9px; border: 1px solid #D8D0C8; border-radius: 4px;
            font-size: 14px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #1A2B4A;
                  box-shadow: 0 0 0 3px rgba(26,43,74,0.10); }
    .hint { font-size: 11px; color: #A8A29E; margin-top: 4px; }
    .actions { padding: 14px 16px; border-top: 1px solid #D8D0C8;
               display: flex; gap: 10px; justify-content: flex-end; }
    button { padding: 9px 18px; border: none; border-radius: 4px; font-size: 13px;
             font-weight: bold; cursor: pointer; }
    .btn-new { background: #f0eeea; color: #555550; }
    .btn-save { background: #1A2B4A; color: #fff; }
    .btn-save:hover { background: #24406b; }
    .msg { padding: 0 16px 14px; font-size: 13px; min-height: 16px; }
    .ok { color: #16A34A; } .error { color: #DC2626; }
    .empty { padding: 24px 16px; color: #A8A29E; font-size: 13px; text-align: center; }
    @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="assets/image.png" alt="Church Teachers College">
      <h1>Users</h1>
    </div>
    <a href="requisitions.html">&larr; Back to requisitions</a>
  </header>

  <div class="wrap">
    <div class="card">
      <h2>All Users <button class="btn-new" onclick="newUser()">+ New User</button></h2>
      <div id="userList"><div class="empty">Loading…</div></div>
    </div>

    <div class="card">
      <h2 id="formTitle">New User</h2>
      <div class="form-body">
        <div class="field">
          <label for="first">First name</label>
          <input id="first">
        </div>
        <div class="field">
          <label for="last">Last name</label>
          <input id="last">
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" autocomplete="off">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email">
        </div>
        <div class="field">
          <label for="osuser">Windows sign-in (OS user)</label>
          <input id="osuser" autocomplete="off">
          <div class="hint">Optional — enables desktop single sign-on.</div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password">
          <div class="hint" id="pwHint">Required for a new user.</div>
        </div>
      </div>
      <div class="msg" id="msg"></div>
      <div class="actions">
        <button class="btn-new" onclick="clearForm()">Clear</button>
        <button class="btn-save" onclick="saveUser()">Save user</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://ctc-requisition-api-aybadkhdftfpf4cf.centralus-01.azurewebsites.net";
    const token = localStorage.getItem("ctc_token");
    if (!token) { window.location.href = "login.html"; }

    // Admin-only screen: bounce non-admins back to the list.
    if (localStorage.getItem("ctc_admin") !== "1") {
      alert("Only administrators can manage users.");
      window.location.href = "requisitions.html";
    }

    let users = [];
    let editingId = null;   // null = creating a new user

    async function api(path, opts = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        ...opts,
        headers: { "Authorization": `Bearer ${token}`,
                   "Content-Type": "application/json", ...(opts.headers || {}) }
      });
      if (res.status === 401) { window.location.href = "login.html"; return null; }
      if (res.status === 403) { throw new Error("You don't have permission for this."); }
      if (!res.ok) {
        let detail = `Request failed (${res.status}).`;
        try { const j = await res.json(); if (j.detail) detail = j.detail; } catch {}
        throw new Error(detail);
      }
      return res.status === 204 ? null : res.json();
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"]/g, c =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    }

    // User arrays: [UserID, FirstName, LastName, UserName, Email, OSuser]
    async function loadUsers() {
      try {
        users = await api("/users") || [];
        renderList();
      } catch (err) {
        document.getElementById("userList").innerHTML =
          `<div class="empty" style="color:#DC2626">Could not load users: ${esc(err.message)}</div>`;
      }
    }

    function renderList() {
      const el = document.getElementById("userList");
      if (!users.length) { el.innerHTML = '<div class="empty">No users yet.</div>'; return; }
      el.innerHTML = `
        <table>
          <thead><tr><th>Name</th><th>Username</th><th>Email</th></tr></thead>
          <tbody>
            ${users.map(u => `
              <tr data-id="${u[0]}" onclick="selectUser(${u[0]})"
                  class="${u[0] === editingId ? 'selected' : ''}">
                <td>${esc(u[2])}, ${esc(u[1])}</td>
                <td>${esc(u[3])}</td>
                <td>${esc(u[4])}</td>
              </tr>`).join("")}
          </tbody>
        </table>`;
    }

    async function selectUser(id) {
      try {
        const u = await api(`/users/${id}`);   // [UserID,First,Last,UserName,Email,OSuser]
        if (!u) return;
        editingId = id;
        document.getElementById("formTitle").textContent = "Edit User";
        document.getElementById("first").value    = u[1] || "";
        document.getElementById("last").value     = u[2] || "";
        document.getElementById("username").value = u[3] || "";
        document.getElementById("email").value    = u[4] || "";
        document.getElementById("osuser").value   = u[5] || "";
        document.getElementById("password").value = "";
        document.getElementById("pwHint").textContent =
          "Leave blank to keep the current password.";
        setMsg("", "");
        renderList();   // refresh row highlight
      } catch (err) { setMsg(err.message, "error"); }
    }

    function newUser() { clearForm(); }

    function clearForm() {
      editingId = null;
      document.getElementById("formTitle").textContent = "New User";
      ["first","last","username","email","osuser","password"].forEach(
        id => document.getElementById(id).value = "");
      document.getElementById("pwHint").textContent = "Required for a new user.";
      setMsg("", "");
      renderList();
    }

    function setMsg(text, cls) {
      const m = document.getElementById("msg");
      m.className = "msg" + (cls ? " " + cls : "");
      m.textContent = text;
    }

    async function saveUser() {
      const body = {
        first: document.getElementById("first").value.trim(),
        last: document.getElementById("last").value.trim(),
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        osuser: document.getElementById("osuser").value.trim(),
        password: document.getElementById("password").value
      };

      if (!body.first || !body.last || !body.username) {
        setMsg("First name, last name, and username are required.", "error");
        return;
      }
      if (editingId === null && !body.password) {
        setMsg("A password is required for a new user.", "error");
        return;
      }

      setMsg("Saving…", "");
      try {
        if (editingId === null) {
          await api("/users", { method: "POST", body: JSON.stringify(body) });
          setMsg("User created.", "ok");
        } else {
          await api(`/users/${editingId}`, { method: "PUT", body: JSON.stringify(body) });
          setMsg("Changes saved.", "ok");
        }
        await loadUsers();
        if (editingId === null) clearForm();
      } catch (err) {
        setMsg("Save failed: " + err.message, "error");
      }
    }

    loadUsers();
  </script>
</body>
</html>
